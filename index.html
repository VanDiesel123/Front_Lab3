<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3 - Білий І. С., ІО-41, варіант 5</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Лабораторна робота №3</h1>
    <h2>Варіант 5</h2>


    <h2>Завдання 1. Використання float</h2>

    <div class="layout float-layout">

        <div class="top-block">
            Text
        </div>

        <div class="float-row">

            <div class="left-block">
                Text
            </div>

            <div class="right-block">
                Img.
            </div>

        </div>

        <div class="bottom-block">
            Img.
        </div>

    </div>

    <h2>Завдання 2. Використання Flexbox</h2>

    <div class="layout flex-layout">

        <div class="top-block">
            Text
        </div>

        <div class="flex-row">

            <div class="left-block">
                Text
            </div>

            <div class="right-block">
                Img.
            </div>

        </div>

        <div class="bottom-block">
            Img.
        </div>

    </div>

</body>
</html>
